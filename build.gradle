plugins {
    id "net.fabricmc.fabric-loom-remap" version "1.16.1"
}

version = "1.1.36"
group = "ru.dogod.craftingtablecycle"

repositories {
    mavenCentral()
    maven {
        url = "https://api.modrinth.com/maven"
    }
    maven {
        url = "https://maven.fabricmc.net/"
    }
}

loom {
    mixin {
        defaultRefmapName = "crafting_table_cycle.refmap.json"
        useLegacyMixinAp = true
    }
}

base {
    archivesName = "inventory-helper"
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.4+1.21.11"
    annotationProcessor "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
    modCompileOnly "io.github.llamalad7:mixinextras-fabric:0.5.5"
    modCompileOnly "maven.modrinth:sodium:mc1.21.11-0.8.12-fabric"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}
